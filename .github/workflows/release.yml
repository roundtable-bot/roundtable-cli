name: Native builds and release
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing unpublished version tag to rebuild and publish (for example v0.2.21)
        required: false
        type: string
        default: ''
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15, target: aarch64-apple-darwin}
          - {os: macos-15-intel, target: x86_64-apple-darwin}
          - {os: ubuntu-22.04, target: x86_64-unknown-linux-gnu}
          - {os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check package and release versions
        env:
          RELEASE_TAG: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const version = JSON.parse(readFileSync('package.json')).version;
          assert.equal(JSON.parse(readFileSync('cli/npm/package.json')).version, version);
          const cargo = readFileSync('cli/Cargo.toml', 'utf8').match(/^version = "([^"]+)"$/m)?.[1];
          assert.equal(cargo, version);
          const tag = process.env.RELEASE_TAG;
          if (tag) {
            assert.match(tag, /^v[0-9]+\.[0-9]+\.[0-9]+$/);
            assert.equal(tag, `v${version}`);
          }
          JS
      - run: cargo test --manifest-path cli/Cargo.toml --locked
      - run: node --test cli/tests/*.test.mjs
      - run: cargo build --manifest-path cli/Cargo.toml --release --locked
      - run: |
          cli/target/release/roundtable --version
          mkdir release
          gzip -c cli/target/release/roundtable > release/roundtable-${{ matrix.target }}.gz
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: release/*.gz
  publish:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: native
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm pack --ignore-scripts --pack-destination release
      - run: |
          cd release
          sha256sum *.gz *.tgz > SHA256SUMS
          gh release create "$RELEASE_TAG" *.gz *.tgz SHA256SUMS --title "Roundtable $RELEASE_TAG" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
